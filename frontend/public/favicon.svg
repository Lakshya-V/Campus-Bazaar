<svg viewBox="0 0 100 100" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Campus Bazaar</title>
  <defs>
